<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zator</title><link rel="stylesheet" href="style.css"></head>
<body class="popup">
  <main>
    <h1>Zator Beta</h1>
    <p id="mode" role="status">Checking…</p>
    <p id="latest"></p>
    <button id="fix" type="button" hidden>Fix this site</button>
    <button id="cancel" type="button" hidden>Cancel trial</button>
    <button id="options" type="button">Settings</button>
    <p class="small">Eligible network failures start a scoped trial automatically. YouTube media retries may reload the watch page once after router approval. POSTs and arbitrary subresources are never replayed; recovery counts only after the router confirms a new connection.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
