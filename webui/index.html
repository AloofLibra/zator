<!doctype html>
<html lang="ru" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>z2r Web UI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="hero-copy">
        <p class="eyebrow">zator</p>
        <h1>z2r Web UI</h1>
        <p class="subtitle">Панель состояния, проверки доступности и ручной фиксации стратегий zapret2.</p>
      </div>

      <div class="header-controls">
        <nav class="tabs" aria-label="Разделы">
          <button class="tab is-active" data-view="status" type="button">Статус</button>
          <button class="tab" data-view="strategies" type="button">Стратегии</button>
        </nav>

        <label class="theme-field" for="theme-mode">
          <span>Тема</span>
          <select id="theme-mode" aria-label="Тема интерфейса">
            <option value="auto">Авто</option>
            <option value="light">Светлая</option>
            <option value="dark">Тёмная</option>
          </select>
        </label>
      </div>
    </header>

    <section class="banner" id="banner" hidden></section>

    <section class="view is-active" id="view-status">
      <div class="actions">
        <div class="service-control" aria-label="Управление zapret2">
          <button id="toggle-service" class="service-toggle" type="button">zapret2</button>
          <button id="restart-service" class="service-restart" type="button" title="Перезапустить zapret2" aria-label="Перезапустить zapret2">↻</button>
        </div>
        <button id="refresh-status" type="button">Обновить</button>
        <button id="run-check" type="button">Проверить доступ</button>
      </div>

      <div class="stats-grid" id="status-cards"></div>

      <section class="panel">
        <div class="panel-header">
          <h2>Профили</h2>
          <button id="open-strategies" class="ghost" type="button">Открыть управление</button>
        </div>
        <div class="profile-grid compact" id="status-profiles"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Проверка доступа</h2>
        </div>
        <div id="check-results" class="checks empty">Нажмите «Проверить доступ», чтобы получить свежие результаты.</div>
      </section>
    </section>

    <section class="view" id="view-strategies">
      <div class="actions">
        <button id="refresh-locks" type="button">Обновить</button>
      </div>
      <div class="profile-grid" id="strategy-cards"></div>
    </section>
  </main>

  <template id="status-card-template">
    <article class="stat-card">
      <span class="label"></span>
      <strong class="value"></strong>
    </article>
  </template>

  <template id="status-profile-template">
    <article class="profile-card">
      <h3></h3>
      <p class="desc"></p>
      <div class="meta-line">
        <span>Текущий lock</span>
        <strong class="current-lock"></strong>
      </div>
    </article>
  </template>

  <template id="strategy-card-template">
    <article class="profile-card">
      <div class="card-top">
        <div>
          <h3></h3>
          <p class="desc"></p>
        </div>
        <span class="chip"></span>
      </div>
      <div class="meta">
        <div class="meta-line">
          <span>Текущий lock</span>
          <strong class="current-lock"></strong>
        </div>
        <div class="meta-line">
          <span>Макс. стратегия</span>
          <strong class="max-lock"></strong>
        </div>
      </div>
      <form class="lock-form">
        <label>
          <span>Номер стратегии</span>
          <div class="number-stepper">
            <input type="number" min="1" step="1" required>
            <div class="stepper-buttons">
              <button type="button" class="step-strategy" data-step="1" aria-label="Увеличить номер стратегии">↑</button>
              <button type="button" class="step-strategy" data-step="-1" aria-label="Уменьшить номер стратегии">↓</button>
            </div>
          </div>
        </label>
        <div class="inline-check empty"></div>
        <div class="card-actions">
          <button type="submit" class="primary">Сохранить</button>
          <button type="button" class="ghost clear-lock">Сбросить</button>
        </div>
      </form>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
